<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4332" />
      <stop offset="50%" stop-color="#0B3327" />
      <stop offset="100%" stop-color="#061E17" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="50%" stop-color="#5AD8B5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#059669" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Islamic star pattern ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#mintGrad)" stroke-width="3" stroke-dasharray="8 12" opacity="0.35" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#5AD8B5" stroke-width="1.5" opacity="0.2" />

  <!-- Central Emblem: Elegant Open Quran & Crescent -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Crescent Moon -->
    <path d="M 40,-130 A 105,105 0 1 0 110,65 A 85,85 0 1 1 40,-130 Z" fill="url(#goldGrad)" opacity="0.95" />
    <!-- Guiding Star -->
    <polygon points="85,-75 89,-63 101,-63 92,-55 95,-43 85,-51 75,-43 78,-55 69,-63 81,-63" fill="#FDE68A" />

    <!-- Open Quran Book Base & Spine -->
    <path d="M 0,20 L -80,-30 C -120,-45 -145,-30 -145,55 L -145,75 C -145,60 -115,45 -80,55 L 0,105 L 80,55 C 115,45 145,60 145,75 L 145,55 C 145,-30 120,-45 80,-30 Z" fill="#0B261D" stroke="#047857" stroke-width="3" />

    <!-- Left Page -->
    <path d="M -5,15 C -45,0 -105,-10 -135,40 L -135,65 C -105,15 -45,25 -5,40 Z" fill="url(#mintGrad)" />
    <!-- Left Page Text lines -->
    <path d="M -115,36 Q -75,20 -25,28" stroke="#0B3327" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <path d="M -110,48 Q -75,32 -25,40" stroke="#0B3327" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

    <!-- Right Page -->
    <path d="M 5,15 C 45,0 105,-10 135,40 L 135,65 C 105,15 45,25 5,40 Z" fill="#E2FBEF" />
    <!-- Right Page Text lines -->
    <path d="M 25,28 Q 75,20 115,36" stroke="#0B3327" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
    <path d="M 25,40 Q 75,32 110,48" stroke="#0B3327" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />

    <!-- Quran Stand / Rihal Motif -->
    <path d="M -55,100 L -90,140 L -65,145 L -35,112 L 0,135 L 35,112 L 65,145 L 90,140 L 55,100 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
